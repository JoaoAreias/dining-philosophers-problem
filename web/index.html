<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dining Philosophers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Dining Philosophers</h1>
      <p class="subtitle">
        Interactive solutions to the
        <a href="https://en.wikipedia.org/wiki/Dining_philosophers_problem">dining philosophers problem</a>,
        simulated deterministically in Rust (WASM).
      </p>
    </header>

    <div id="banner" class="banner hidden"></div>

    <section class="config">
      <label>Strategy
        <select id="strategy">
          <option value="naive">Naive (deadlocks)</option>
          <option value="resource-ordering">Resource ordering</option>
          <option value="arbiter">Arbiter (waiter)</option>
          <option value="semaphore">Semaphore (N−1 seats)</option>
          <option value="monitor">Monitor (condition vars)</option>
          <option value="chandy-misra">Chandy–Misra</option>
        </select>
      </label>
      <label>Philosophers
        <input id="count" type="number" min="2" max="15" value="5">
      </label>
      <label>Scheduler
        <select id="scheduler">
          <option value="fair">Fair</option>
          <option value="random">Random</option>
          <option value="adversarial">Adversarial</option>
        </select>
      </label>
      <label>Seed
        <span class="seed-row">
          <input id="seed" type="number" min="0" value="1">
          <button id="randomize" type="button" title="Random seed">🎲</button>
        </span>
      </label>
      <button id="run" type="button" class="primary">Run</button>
    </section>

    <section class="stage">
      <div id="deadlock" class="deadlock hidden"></div>
      <svg id="table" viewBox="0 0 460 460" role="img" aria-label="Dining table"></svg>
      <div class="legend">
        <span><i class="dot thinking"></i>Thinking</span>
        <span><i class="dot hungry"></i>Hungry</span>
        <span><i class="dot eating"></i>Eating</span>
        <span><i class="dot other"></i>Other</span>
      </div>
    </section>

    <section class="playback">
      <button id="step-back" type="button" title="Step back">⏮</button>
      <button id="play" type="button" class="primary" title="Play/pause">▶</button>
      <button id="step-fwd" type="button" title="Step forward">⏭</button>
      <label class="speed">Speed
        <input id="speed" type="range" min="1" max="60" value="10">
        <span id="speed-label">10 t/s</span>
      </label>
      <label class="scrub">
        <input id="scrub" type="range" min="0" max="0" value="0">
        <span id="tick-label">tick 0</span>
      </label>
    </section>

    <footer>
      <a href="https://github.com/JoaoAreias/dining-philosophers-problem">Source on GitHub</a>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
