[package]
name = "engine"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

# If you add the `rand` crate later: on wasm32, `getrandom` (pulled in by rand's
# default features) fails to build without its "js" feature. Since every run is
# seeded explicitly, prefer a seedable PRNG with no OS entropy, e.g.
# rand_chacha + rand with default-features = false, or hand-roll a xorshift.
